<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>HHHS 團購系統</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 16px;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
    }

    .user-box {
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 22px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      line-height: 1.6;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .section-subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 13px;
    }

    /* ===== Carousel ===== */

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      padding: 2px 6% 8px 0;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 91%;
      scroll-snap-align: start;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      min-height: 245px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
    }

    .closed-card {
      opacity: .88;
    }

    .product-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .info {
      color: #555;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .summary {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      font-size: 16px;
      font-weight: bold;
    }

    .card-bottom {
      margin-top: auto;
    }

    .status-open {
      display: inline-block;
      color: #08883b;
      background: #eaf8ef;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status-closed {
      display: inline-block;
      color: #666;
      background: #eee;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* ===== dots ===== */

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d0d0d0;
      transition: .2s;
    }

    .dot.active {
      width: 9px;
      height: 9px;
      background: #06c755;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #06c755;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: .8;
    }

    .secondary-button {
      background: #888;
      margin-top: 8px;
    }

    .message {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      color: #666;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      line-height: 1.7;
    }

    .success {
      color: #0a8f3d;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .retry-note {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    /* ===== 訂購頁 ===== */

    .quantity-box {
      margin-top: 18px;
    }

    .quantity-label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .quantity-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 22px;
      text-align: center;
      outline: none;
    }

    .quantity-input:focus {
      border-color: #06c755;
    }

    .order-total {
      margin-top: 18px;
      padding: 16px;
      background: #f7f7f7;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .order-total-price {
      font-size: 26px;
      margin-top: 4px;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #888;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">HHHS 團購系統</div>
    <div class="subtitle">LINE 團購小幫手</div>
  </div>

  <div id="userBox" class="user-box">
    正在確認 LINE 身分...
  </div>


  <!-- =====================================================
       首頁
  ====================================================== -->

  <div id="homePanel">

    <!-- 開放團購 -->
    <div class="section">

      <div class="section-title">
        🛒 目前開放團購
      </div>

      <div class="section-subtitle">
        左右滑動查看更多團購
      </div>

      <div id="openLoading" class="message">
        正在載入團購資料...
      </div>

      <div
        id="openCarousel"
        class="carousel"
        style="display:none;">
      </div>

      <div
        id="openDots"
        class="dots"
        style="display:none;">
      </div>

    </div>


    <!-- 最近結束 -->
    <div class="section">

      <div class="section-title">
        🕘 最近結束的團購
      </div>

      <div class="section-subtitle">
        顯示近三個月已結束的項目
      </div>

      <div id="closedLoading" class="message">
        正在載入歷史資料...
      </div>

      <div
        id="closedCarousel"
        class="carousel"
        style="display:none;">
      </div>

      <div
        id="closedDots"
        class="dots"
        style="display:none;">
      </div>

    </div>

  </div>


  <!-- =====================================================
       訂購頁
  ====================================================== -->

  <div id="orderPanel" style="display:none;">

    <div class="section-title">
      我的訂購
    </div>

    <div class="card">

      <div id="orderProductName" class="product-name"></div>

      <div
        id="orderDescription"
        class="description"
        style="display:none;">
      </div>

      <div class="info">
        單價：
        <strong id="orderPrice"></strong>
        /
        <span id="orderUnit"></span>
      </div>

      <div class="info">
        截止：
        <span id="orderEndAt"></span>
      </div>

      <div class="info">
        目前團購：
        <strong id="orderPeopleCount">0</strong> 人｜
        <strong id="orderTotalQuantity">0</strong>
        <span id="orderSummaryUnit"></span>
      </div>


      <div class="quantity-box">

        <label class="quantity-label" for="orderQty">
          購買數量
        </label>

        <input
          type="number"
          id="orderQty"
          class="quantity-input"
          min="0"
          step="1"
          value="1"
          inputmode="numeric"
          oninput="updateOrderTotal()"
        >

        <div class="hint">
          直接輸入需要的總數量，例如：10
        </div>

      </div>


      <div class="order-total">

        預估金額

        <div
          id="orderTotal"
          class="order-total-price">
          $0
        </div>

      </div>


      <button
        type="button"
        onclick="confirmOrder()">
        確認數量
      </button>

      <button
        type="button"
        class="secondary-button"
        onclick="closeOrder()">
        返回團購列表
      </button>

    </div>

  </div>

</div>



<script>

/* =========================================================
   基本設定
========================================================= */

const LIFF_ID =
  '2011825033-7byocb0b';

const API_URL =
  'https://script.google.com/macros/s/AKfycbyL7dyXlrGU9PNq6jqqcnXrCXKK3Ouhct68vCo2W9qFYzyH2R2SL9y5zCWuiKbDcva1/exec';

const LOAD_TIMEOUT_MS = 8000;
const MAX_RETRY_COUNT = 3;

let currentUser = null;
let currentBuy = null;

let openRetryCount = 0;
let closedRetryCount = 0;

window.currentGroupBuys = [];


/* =========================================================
   初始化
========================================================= */

window.onload = function () {
  initLiff();
};


function initLiff() {

  const userBox =
    document.getElementById('userBox');

  userBox.innerHTML =
    '正在初始化 LINE...';


  liff.init({
    liffId: LIFF_ID
  })
  .then(() => {

    if (!liff.isLoggedIn()) {

      userBox.innerHTML =
        '目前尚未登入 LINE';

      return null;
    }

    return liff.getProfile();

  })
  .then(profile => {

    if (!profile) {
      return;
    }

    currentUser = profile;

    userBox.innerHTML = `
      你好，<strong>${escapeHtml(profile.displayName)}</strong><br>
      <span class="success">LINE 身分辨識成功</span>
    `;

    loadOpenGroupBuys();
    loadClosedGroupBuys();

  })
  .catch(error => {

    console.error(error);

    userBox.innerHTML = `
      <span class="error">
        LINE 身分確認失敗
      </span><br>
      ${escapeHtml(error.message || String(error))}
    `;

  });
}


/* =========================================================
   開放團購
========================================================= */

function loadOpenGroupBuys() {

  loadJsonp({

    action: 'openGroupBuys',

    callbackName: 'handleOpenGroupBuys',

    scriptId: 'openGroupBuyJsonp',

    onSuccess: function(result) {

      openRetryCount = 0;

      const items =
        result.data || [];

      window.currentGroupBuys =
        items;

      renderOpenCarousel(items);
    },

    onError: function(message) {

      openRetryCount++;

      showOpenError(message);
    }

  });
}


window.handleOpenGroupBuys =
function(result) {

  if (!result || !result.success) {

    openRetryCount++;

    showOpenError(
      '團購資料讀取失敗'
    );

    return;
  }

  openRetryCount = 0;

  const items =
    result.data || [];

  window.currentGroupBuys =
    items;

  renderOpenCarousel(items);
};


function renderOpenCarousel(items) {

  const loading =
    document.getElementById('openLoading');

  const carousel =
    document.getElementById('openCarousel');

  const dots =
    document.getElementById('openDots');


  if (!items.length) {

    loading.style.display =
      'block';

    loading.innerHTML =
      '目前沒有開放中的團購';

    carousel.style.display =
      'none';

    dots.style.display =
      'none';

    return;
  }


  loading.style.display =
    'none';

  carousel.style.display =
    'flex';

  dots.style.display =
    'flex';

  carousel.innerHTML =
    '';

  dots.innerHTML =
    '';


  items.forEach((item, index) => {

    const slide =
      document.createElement('div');

    slide.className =
      'slide';


    slide.innerHTML = `

      <div class="card">

        <div>
          <span class="status-open">
            開放中
          </span>
        </div>

        <div class="product-name">
          ${escapeHtml(item.name)}
        </div>

        ${
          item.description
          ? `
            <div class="description">
              ${escapeHtml(item.description)}
            </div>
          `
          : ''
        }

        <div class="info">
          單價：
          $${formatNumber(item.price)}
          /
          ${escapeHtml(item.unit)}
        </div>

        <div class="info">
          截止：
          ${formatDate(item.endAt)}
        </div>

        <div class="summary">
          ${Number(item.peopleCount || 0)} 人
          ｜
          ${Number(item.totalQuantity || 0)}
          ${escapeHtml(item.unit)}
        </div>

        <div class="card-bottom">

          <button
            type="button"
            onclick="openOrder('${escapeJs(item.buyId)}')">
            我要團購
          </button>

        </div>

      </div>
    `;

    carousel.appendChild(slide);


    const dot =
      document.createElement('div');

    dot.className =
      index === 0
        ? 'dot active'
        : 'dot';

    dots.appendChild(dot);
  });


  setupCarouselDots(
    carousel,
    dots
  );
}


/* =========================================================
   最近已關閉團購
========================================================= */

function loadClosedGroupBuys() {

  loadJsonp({

    action: 'recentClosedGroupBuys',

    callbackName: 'handleClosedGroupBuys',

    scriptId: 'closedGroupBuyJsonp',

    onError: function(message) {

      closedRetryCount++;

      showClosedError(message);
    }

  });
}


window.handleClosedGroupBuys =
function(result) {

  if (!result || !result.success) {

    closedRetryCount++;

    showClosedError(
      '歷史資料讀取失敗'
    );

    return;
  }

  closedRetryCount = 0;

  renderClosedCarousel(
    result.data || []
  );
};


function renderClosedCarousel(items) {

  const loading =
    document.getElementById('closedLoading');

  const carousel =
    document.getElementById('closedCarousel');

  const dots =
    document.getElementById('closedDots');


  if (!items.length) {

    loading.style.display =
      'block';

    loading.innerHTML =
      '近三個月沒有已結束的團購';

    carousel.style.display =
      'none';

    dots.style.display =
      'none';

    return;
  }


  loading.style.display =
    'none';

  carousel.style.display =
    'flex';

  dots.style.display =
    'flex';

  carousel.innerHTML =
    '';

  dots.innerHTML =
    '';


  items.forEach((item, index) => {

    const slide =
      document.createElement('div');

    slide.className =
      'slide';


    slide.innerHTML = `

      <div class="card closed-card">

        <div>
          <span class="status-closed">
            已結束
          </span>
        </div>

        <div class="product-name">
          ${escapeHtml(item.name)}
        </div>

        ${
          item.description
          ? `
            <div class="description">
              ${escapeHtml(item.description)}
            </div>
          `
          : ''
        }

        <div class="info">
          單價：
          $${formatNumber(item.price)}
          /
          ${escapeHtml(item.unit)}
        </div>

        <div class="info">
          結束：
          ${formatDate(
            item.closedAt || item.endAt
          )}
        </div>

        <div class="summary">
          最終：
          ${Number(item.peopleCount || 0)} 人
          ｜
          ${Number(item.totalQuantity || 0)}
          ${escapeHtml(item.unit)}
        </div>

      </div>
    `;

    carousel.appendChild(slide);


    const dot =
      document.createElement('div');

    dot.className =
      index === 0
        ? 'dot active'
        : 'dot';

    dots.appendChild(dot);
  });


  setupCarouselDots(
    carousel,
    dots
  );
}


/* =========================================================
   Carousel 圓點
========================================================= */

function setupCarouselDots(
  carousel,
  dotsContainer
) {

  let scrollTimer = null;


  carousel.addEventListener(
    'scroll',
    function () {

      clearTimeout(scrollTimer);

      scrollTimer =
        setTimeout(function () {

          const slides =
            carousel.querySelectorAll(
              '.slide'
            );

          if (!slides.length) {
            return;
          }


          let closestIndex = 0;
          let closestDistance = Infinity;


          slides.forEach(
            (slide, index) => {

              const distance =
                Math.abs(
                  slide.offsetLeft
                  -
                  carousel.scrollLeft
                );

              if (
                distance
                <
                closestDistance
              ) {

                closestDistance =
                  distance;

                closestIndex =
                  index;
              }
            }
          );


          const dots =
            dotsContainer.querySelectorAll(
              '.dot'
            );


          dots.forEach(
            (dot, index) => {

              dot.classList.toggle(
                'active',
                index === closestIndex
              );

            }
          );

        }, 60);

    }
  );
}


/* =========================================================
   JSONP
========================================================= */

function loadJsonp(options) {

  const old =
    document.getElementById(
      options.scriptId
    );

  if (old) {
    old.remove();
  }


  let finished =
    false;


  const script =
    document.createElement('script');

  script.id =
    options.scriptId;


  script.src =
    API_URL
    +
    '?action='
    +
    encodeURIComponent(
      options.action
    )
    +
    '&callback='
    +
    encodeURIComponent(
      options.callbackName
    )
    +
    '&t='
    +
    Date.now();


  const timeout =
    setTimeout(function () {

      if (finished) {
        return;
      }

      finished = true;

      script.remove();

      options.onError(
        '資料讀取逾時'
      );

    }, LOAD_TIMEOUT_MS);


  script.onload =
    function () {

      finished = true;

      clearTimeout(timeout);
    };


  script.onerror =
    function () {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      options.onError(
        '無法連線至資料庫'
      );
    };


  document.body.appendChild(
    script
  );
}


/* =========================================================
   錯誤處理
========================================================= */

function showOpenError(message) {

  const loading =
    document.getElementById('openLoading');

  loading.style.display =
    'block';


  if (
    openRetryCount
    <
    MAX_RETRY_COUNT
  ) {

    loading.innerHTML = `

      <div class="error">
        ${escapeHtml(message)}
      </div>

      <div class="retry-note">
        可能是網路或系統暫時忙碌。
      </div>

      <button onclick="loadOpenGroupBuys()">
        重新整理
      </button>
    `;

  } else {

    loading.innerHTML = `

      <div class="error">
        系統目前多次連線失敗
      </div>

      <div class="retry-note">
        請稍後再試。<br>
        若持續無法使用，請聯繫管理員。
      </div>

      <button onclick="loadOpenGroupBuys()">
        再試一次
      </button>
    `;
  }
}


function showClosedError(message) {

  const loading =
    document.getElementById(
      'closedLoading'
    );

  loading.style.display =
    'block';

  loading.innerHTML = `

    <div class="error">
      ${escapeHtml(message)}
    </div>

    <button onclick="loadClosedGroupBuys()">
      重新整理
    </button>
  `;
}


/* =========================================================
   訂購頁面
========================================================= */

function openOrder(buyId) {

  if (!currentUser) {

    alert(
      '尚未取得 LINE 使用者資料'
    );

    return;
  }


  const item =
    window.currentGroupBuys.find(
      x =>
        String(x.buyId)
        ===
        String(buyId)
    );


  if (!item) {

    alert(
      '找不到這個團購項目'
    );

    return;
  }


  currentBuy =
    item;


  document.getElementById(
    'orderProductName'
  ).textContent =
    item.name || '';


  const description =
    document.getElementById(
      'orderDescription'
    );


  if (item.description) {

    description.textContent =
      item.description;

    description.style.display =
      'block';

  } else {

    description.style.display =
      'none';
  }


  document.getElementById(
    'orderPrice'
  ).textContent =
    '$'
    +
    formatNumber(item.price);


  document.getElementById(
    'orderUnit'
  ).textContent =
    item.unit || '';


  document.getElementById(
    'orderEndAt'
  ).textContent =
    formatDate(item.endAt);


  document.getElementById(
    'orderPeopleCount'
  ).textContent =
    Number(
      item.peopleCount || 0
    );


  document.getElementById(
    'orderTotalQuantity'
  ).textContent =
    Number(
      item.totalQuantity || 0
    );


  document.getElementById(
    'orderSummaryUnit'
  ).textContent =
    item.unit || '';


  document.getElementById(
    'orderQty'
  ).value =
    1;


  document.getElementById(
    'homePanel'
  ).style.display =
    'none';


  document.getElementById(
    'orderPanel'
  ).style.display =
    'block';


  updateOrderTotal();


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}


/* =========================================================
   數量與金額
========================================================= */

function updateOrderTotal() {

  if (!currentBuy) {
    return;
  }


  const qty =
    Number(
      document.getElementById(
        'orderQty'
      ).value || 0
    );


  const total =
    qty
    *
    Number(
      currentBuy.price || 0
    );


  document.getElementById(
    'orderTotal'
  ).textContent =
    '$'
    +
    formatNumber(total);
}


/* =========================================================
   目前仍是測試確認
========================================================= */

function confirmOrder() {

  if (!currentBuy) {
    return;
  }


  const qty =
    Number(
      document.getElementById(
        'orderQty'
      ).value || 0
    );


  if (
    !Number.isInteger(qty)
    ||
    qty < 0
  ) {

    alert(
      '請輸入正確的整數數量'
    );

    return;
  }


  const total =
    qty
    *
    Number(
      currentBuy.price || 0
    );


  alert(

    '訂購確認\n\n'
    +
    '商品：'
    +
    currentBuy.name
    +
    '\n'
    +
    '數量：'
    +
    qty
    +
    currentBuy.unit
    +
    '\n'
    +
    '金額：$'
    +
    formatNumber(total)
    +
    '\n\n'
    +
    '下一步會正式寫入 Google Sheet。'
  );
}


function closeOrder() {

  currentBuy =
    null;


  document.getElementById(
    'orderPanel'
  ).style.display =
    'none';


  document.getElementById(
    'homePanel'
  ).style.display =
    'block';


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}


/* =========================================================
   工具
========================================================= */

function formatDate(value) {

  if (!value) {
    return '未設定';
  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;
  }


  return date.toLocaleString(
    'zh-TW',
    {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }
  );
}


function formatNumber(value) {

  return Number(
    value || 0
  ).toLocaleString(
    'zh-TW'
  );
}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#039;');
}


function escapeJs(value) {

  return String(
    value ?? ''
  )
  .replace(/\\/g, '\\\\')
  .replace(/'/g, "\\'");
}
